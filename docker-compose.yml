services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_fin}
      POSTGRES_USER: ${POSTGRES_USER:-my_fin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my_fin_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-my_fin} -d ${POSTGRES_DB:-my_fin}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: